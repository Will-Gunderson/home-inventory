name: Deploy to Cloudflare

# Every push to main goes live at home.willgunderson.com.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Type-check and build the frontend + worker.
      - run: npm run build

      # Apply any new database migrations (already-applied ones are skipped).
      - run: npx wrangler d1 migrations apply home-inventory --remote

      - run: npx wrangler deploy
